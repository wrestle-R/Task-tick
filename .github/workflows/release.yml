name: Prepare Task-tick release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  linux:
    needs: checks
    runs-on: ubuntu-24.04
    environment: native-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri -w desktop -- build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Stable download names
        run: |
          mkdir -p release-files
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage release-files/Task-tick-linux-x86_64.AppImage
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig release-files/Task-tick-linux-x86_64.AppImage.sig
          cp desktop/src-tauri/target/release/bundle/deb/*.deb release-files/Task-tick-linux-x86_64.deb
          cp desktop/scripts/install-app.sh release-files/install-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release-files/*
          if-no-files-found: error
  android:
    needs: checks
    runs-on: ubuntu-24.04
    environment: native-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci --prefix app
      - name: Restore signing identity
        env:
          KEYSTORE: ${{ secrets.TICK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure the native-release signing secrets first'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/tick-release.keystore"
          chmod 600 "$RUNNER_TEMP/tick-release.keystore"
      - run: ./gradlew :app:assembleRelease
        working-directory: app/android
        env:
          TICK_ANDROID_KEYSTORE: ${{ runner.temp }}/tick-release.keystore
          TICK_ANDROID_STORE_PASSWORD: ${{ secrets.TICK_ANDROID_STORE_PASSWORD }}
          TICK_ANDROID_KEY_ALIAS: ${{ secrets.TICK_ANDROID_KEY_ALIAS }}
          TICK_ANDROID_KEY_PASSWORD: ${{ secrets.TICK_ANDROID_KEY_PASSWORD }}
      - run: cp app/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Task-tick-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/Task-tick-android.apk
          if-no-files-found: error
  draft:
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          node desktop/scripts/release-manifest.mjs artifacts
          cd artifacts
          sha256sum *.apk *.deb *.AppImage *.sig *.json *.sh > SHA256SUMS
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft --title "Task-tick $RELEASE_TAG" --notes 'Build checks passed. Device, package installation and update acceptance must be recorded before publishing.' ./*
