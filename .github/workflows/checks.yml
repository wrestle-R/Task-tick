name: Task-tick checks
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node packages/ui/scripts/theme.mjs --check
      - run: npm test
      - run: python3 docs/tests/spotify.py
      - run: python3 docs/tests/integration-install.py
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Marketing layout and appearance acceptance
        run: |
          npm run start -w next -- --port 3004 > /tmp/task-tick-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3004/ > /dev/null; then break; fi
            sleep 1
          done
          TICK_TEST_BASE_URL=http://127.0.0.1:3004 node docs/tests/marketing.mjs
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Restore Firebase Android configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.TICK_FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" > app/android/app/google-services.json
          fi
      - run: npm ci --prefix app
      - run: npx --prefix app tsc --noEmit -p app/tsconfig.json
      - name: Create disposable debug signing key
        run: keytool -genkeypair -noprompt -keystore app/android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
      - run: ./gradlew :app:assembleDebug
        working-directory: app/android
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build -w desktop
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
